<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview</title>
<!--
  Every animal and plant in this folder, turning and playing its clip.
  Serve this folder's parent and open /preview/:

      cd mega && python3 -m http.server 8000        then http://localhost:8000/preview/
      cd roadside && python3 -m http.server 8001    then http://localhost:8001/preview/

  The list is roster.json beside this page. Each card loads its mesh.glb and nothing else.
  A model that is not built yet fails on the card.
  three.js 0.160.0 from jsDelivr. The packed meshes need the KTX2 and meshopt decoders.
-->
<style>
  :root { --ink: #1c2330; --soft: #5b6676; --line: #dfe4ea; --page: #f4f6f8; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --ink: #e8ecf1; --soft: #9aa6b5; --line: #2c3442; --page: #12161d; --card: #1a202a; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 3; background: var(--page); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  h1 small { font-weight: 400; color: var(--soft); margin-left: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
  .row > span.label { color: var(--soft); width: 52px; font-size: 12px; }
  button { font: inherit; font-size: 12px; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--ink); color: var(--page); border-color: var(--ink); }
  #status { color: var(--soft); font-size: 12px; margin-left: auto; }
  main { padding: 4px 16px 48px; }
  section h2 { font-size: 16px; margin: 22px 0 8px; }
  section h2 small { font-weight: 400; color: var(--soft); margin-left: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .view { position: relative; aspect-ratio: 4 / 3; background: linear-gradient(#c98a4b, #7a4a2a); cursor: pointer; }
  .view .load { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.18); pointer-events: none; }
  .view .load i { display: block; height: 100%; width: 0; background: #F5B301; }
  .view .load.done i { width: 100%; background: #3FB950; }
  .view .load.failed { background: transparent; }
  .view .load.failed i { width: 100%; background: #E5534B; }
  .miss { position: absolute; left: 10px; right: 10px; top: 12px; margin: 0; color: #fff; font-size: 13px; text-shadow: 0 1px 2px rgba(0,0,0,.6); }
  .text { padding: 8px 10px 12px; }
  .name { font-weight: 600; }
  .name small { font-weight: 400; color: var(--soft); }
  .meta { color: var(--soft); font-size: 12px; margin-top: 4px; }
  canvas#stage { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 2; }
  #big { width: min(1100px, calc(100vw - 32px)); padding: 0; border: 0; background: var(--card); color: var(--ink); }
  #big .bigview { width: 100%; aspect-ratio: 16 / 10; display: block; background: #1a202a; }
  #big .bar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px; }
  #big .bar b { margin-right: auto; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1 id="title">Preview <small id="count"></small></h1>
  <div class="row"><span class="label">View</span>
    <button data-angle="turn" aria-pressed="true">Turning</button>
    <button data-angle="side" aria-pressed="false">Side</button>
    <button data-angle="three" aria-pressed="false">Three-quarter</button>
    <button data-angle="front" aria-pressed="false">Front</button>
    <button data-angle="top" aria-pressed="false">Above</button>
    <button data-clip="move" aria-pressed="true">Moving</button>
    <button data-clip="idle" aria-pressed="false">Idle</button>
    <button data-clip="still" aria-pressed="false">Still</button>
    <button id="reload">Reload</button>
    <span id="status"></span>
  </div>
</header>
<main id="main"></main>
<canvas id="stage"></canvas>
<dialog id="big">
  <canvas class="bigview"></canvas>
  <div class="bar"><b id="bigName"></b>
    <button data-bigclip="move">Moving</button>
    <button data-bigclip="idle">Idle</button>
    <button data-bigclip="still">Still</button>
    <span style="font-size:12px;color:var(--soft)">Drag to turn, scroll to zoom</span>
    <button id="bigClose">Close</button>
  </div>
</dialog>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { KTX2Loader } from "three/addons/loaders/KTX2Loader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const state = { angle: "turn", clip: "move" };
let roster = null, stamp = Date.now();
const views = [];
const probe = new THREE.WebGLRenderer();
const ktx2 = new KTX2Loader().setTranscoderPath("https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/").detectSupport(probe);
probe.dispose(); probe.forceContextLoss();
const loader = new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder);
const status = document.getElementById("status");
let loaded = 0, failed = 0;

function group(attr, apply) {
  const buttons = document.querySelectorAll(`[data-${attr}]`);
  for (const b of buttons) b.onclick = () => {
    for (const o of buttons) o.setAttribute("aria-pressed", String(o === b));
    apply(b.dataset[attr]);
  };
}
group("angle", value => { state.angle = value; for (const view of views) aim(view); });
group("clip", value => { state.clip = value; for (const view of views) play(view); });
document.getElementById("reload").onclick = () => start();

function play(view, clip = state.clip) {
  if (!view.mixer) return;
  const wanted = clip === "idle" ? "idle" : clip === "move" ? (view.move || "idle") : null;
  for (const [name, action] of Object.entries(view.actions)) {
    if (name === wanted) action.reset().play();
    else action.stop();
  }
  if (!wanted) view.mixer.setTime(0);
}

const ANGLES = { side: -Math.PI / 2, three: -Math.PI / 4, front: 0 };
function aim(view) {
  const reach = view.reach;
  if (!reach) return;
  if (state.angle === "top") view.camera.position.set(0, reach * 1.05, reach * 0.35);
  else view.camera.position.set(0, reach * 0.28, reach);
  view.camera.lookAt(0, 0, 0);
  if (state.angle in ANGLES) view.pivot.rotation.y = ANGLES[state.angle];
  else if (state.angle === "top") view.pivot.rotation.y = -Math.PI / 4;
}

function shadow(width) {
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 64;
  const paint = canvas.getContext("2d");
  const grad = paint.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, "rgba(0,0,0,0.35)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  paint.fillStyle = grad;
  paint.fillRect(0, 0, 64, 64);
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, width), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, depthWrite: false }));
  mesh.rotation.x = -Math.PI / 2;
  return mesh;
}

function stage(item) {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x51483f, 1.4));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(1.5, 3, 2.5);
  scene.add(sun);
  const camera = new THREE.PerspectiveCamera(30, 4 / 3, 0.01, 200);
  const pivot = new THREE.Group();
  scene.add(pivot);
  return { scene, camera, pivot, mixer: null, actions: {}, id: item.id, move: null, reach: 0 };
}

function frameOf(gltf, facts) {
  if (facts && facts.box) {
    const min = new THREE.Vector3().fromArray(facts.box[0]);
    const max = new THREE.Vector3().fromArray(facts.box[1]);
    const box = new THREE.Box3(min, max);
    return { centre: box.getCenter(new THREE.Vector3()), size: box.getSize(new THREE.Vector3()), minY: min.y };
  }
  const box = new THREE.Box3().setFromObject(gltf.scene);
  return { centre: box.getCenter(new THREE.Vector3()), size: box.getSize(new THREE.Vector3()), minY: box.min.y };
}

function show(view, gltf, facts) {
  const { centre, size, minY } = frameOf(gltf, facts);
  gltf.scene.position.sub(centre);
  view.pivot.add(gltf.scene);
  const grounded = minY > -Math.max(0.05, size.y * 0.05);
  if (grounded) {
    const disc = shadow(Math.max(size.x, size.z) * 1.6);
    disc.position.y = -size.y / 2 + 0.001;
    view.pivot.add(disc);
  }
  view.reach = Math.max(size.x, size.y, size.z) * 2.2 + 0.05;
  view.camera.near = Math.max(view.reach / 2000, 0.001);
  view.camera.far = view.reach * 12;
  view.mixer = new THREE.AnimationMixer(gltf.scene);
  for (const clip of gltf.animations) {
    view.actions[clip.name] = view.mixer.clipAction(clip);
    if (clip.name === "swim" || clip.name === "walk" || clip.name === "fly") view.move = clip.name;
  }
  aim(view);
  play(view);
}

const queue = [];
let running = 0;
function enqueue(job) { queue.push(job); pump(); }
function pump() { while (running < 4 && queue.length) { running++; queue.shift()().then(() => { running--; pump(); }); } }
function report() {
  status.textContent = `${loaded} of ${views.length} models loaded` + (failed ? `, ${failed} failed` : "");
}
const fresh = path => `${path}?v=${stamp}`;

function loadModel(path, done) {
  const attempt = left => loader.load(fresh(path), gltf => done(gltf), undefined, error => {
    if (left > 0) return setTimeout(() => attempt(left - 1), 400);
    done(null, error);
  });
  attempt(2);
}

async function factsFor(model) {
  try {
    const answer = await fetch(fresh(model.replace(/mesh\.glb$/, "made.json")), { cache: "no-store" });
    if (!answer.ok) return null;
    const body = await answer.json();
    return body.files && body.files["mesh.glb"] ? body.files["mesh.glb"].facts : null;
  } catch (error) { return null; }
}

function meta(item, facts) {
  if (!facts || !facts.size) return item.shape;
  const longest = Math.max(...facts.size);
  const kb = facts.bytes ? Math.round(facts.bytes / 1024) : null;
  const bits = [item.shape, longest.toFixed(1) + " m"];
  if (facts.triangles) bits.push(facts.triangles + " triangles");
  if (kb) bits.push(kb + " KB");
  return bits.join(" · ");
}

function card(item) {
  const element = document.createElement("div");
  element.className = "card";
  element.innerHTML = `<div class="view"><div class="load"><i></i></div></div><div class="text">
    <div class="name">${item.name} <small>${item.id}</small></div>
    <div class="meta">${item.shape}</div></div>`;
  const box = element.querySelector(".view");
  const bar = element.querySelector(".load");
  const view = stage(item);
  view.element = box;
  views.push(view);
  box.onclick = () => enlarge(item);
  enqueue(() => new Promise(done => loadModel(item.model, async (gltf, error) => {
    if (!views.includes(view)) return done();
    if (!gltf) {
      failed++;
      bar.classList.add("failed");
      box.insertAdjacentHTML("beforeend", `<p class="miss">could not load ${item.model}</p>`);
      console.error(item.model, error);
      report();
      return done();
    }
    const facts = await factsFor(item.model);
    if (!views.includes(view)) return done();
    show(view, gltf, facts);
    element.querySelector(".meta").textContent = meta(item, facts);
    bar.classList.add("done");
    loaded++;
    report();
    done();
  })));
  return element;
}

function layout() {
  const main = document.getElementById("main");
  main.textContent = "";
  views.length = 0;
  queue.length = 0;
  loaded = failed = 0;
  let count = 0;
  for (const group of roster.groups) {
    if (!group.items || !group.items.length) continue;
    const section = document.createElement("section");
    section.innerHTML = `<h2>${group.name} <small>${group.items.length}</small></h2>`;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const item of group.items) { grid.appendChild(card(item)); count++; }
    section.appendChild(grid);
    main.appendChild(section);
  }
  document.getElementById("count").textContent = count + " models";
  report();
}

const big = document.getElementById("big");
const bigCanvas = big.querySelector("canvas");
const bigRenderer = new THREE.WebGLRenderer({ canvas: bigCanvas, antialias: true, alpha: true });
bigRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
let bigView = null, bigControls = null;
function enlarge(item) {
  document.getElementById("bigName").textContent = `${item.name} (${item.id})`;
  bigView = stage(item);
  big.showModal();
  loadModel(item.model, async gltf => {
    if (!gltf || !bigView) return;
    const facts = await factsFor(item.model);
    if (!bigView) return;
    show(bigView, gltf, facts);
    bigView.camera.position.set(bigView.reach * 0.62, bigView.reach * 0.28, bigView.reach * 0.62);
    bigView.pivot.rotation.y = 0;
    if (bigControls) bigControls.dispose();
    bigControls = new OrbitControls(bigView.camera, bigCanvas);
    bigControls.target.set(0, 0, 0);
    bigControls.update();
  });
}
for (const button of document.querySelectorAll("[data-bigclip]")) {
  button.onclick = () => bigView && play(bigView, button.dataset.bigclip);
}
document.getElementById("bigClose").onclick = () => big.close();
big.addEventListener("close", () => { bigView = null; });

const canvas = document.getElementById("stage");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.1);
  const width = canvas.clientWidth, height = canvas.clientHeight;
  if (canvas.width !== Math.floor(width * renderer.getPixelRatio()) || canvas.height !== Math.floor(height * renderer.getPixelRatio())) renderer.setSize(width, height, false);
  renderer.setScissorTest(false);
  renderer.clear();
  renderer.setScissorTest(true);
  const top = document.querySelector("header").getBoundingClientRect().bottom;
  for (const view of views) {
    const rect = view.element.getBoundingClientRect();
    if (rect.bottom < top || rect.top > height || rect.right < 0 || rect.left > width || !rect.width) continue;
    if (view.mixer && state.clip !== "still") view.mixer.update(dt);
    if (state.angle === "turn") view.pivot.rotation.y += dt * 0.45;
    const y0 = Math.max(rect.top, top);
    renderer.setViewport(rect.left, height - rect.bottom, rect.width, rect.height);
    renderer.setScissor(rect.left, height - rect.bottom, rect.width, rect.bottom - y0);
    view.camera.aspect = rect.width / rect.height;
    view.camera.updateProjectionMatrix();
    renderer.render(view.scene, view.camera);
  }
  if (bigView && big.open) {
    const w = bigCanvas.clientWidth, h = bigCanvas.clientHeight;
    if (bigCanvas.width !== Math.floor(w * bigRenderer.getPixelRatio())) bigRenderer.setSize(w, h, false);
    if (bigView.mixer && state.clip !== "still") bigView.mixer.update(dt);
    bigView.camera.aspect = w / h;
    bigView.camera.updateProjectionMatrix();
    bigRenderer.render(bigView.scene, bigView.camera);
  }
  requestAnimationFrame(frame);
}

async function start() {
  stamp = Date.now();
  status.textContent = "reading roster.json";
  try {
    const answer = await fetch(fresh("roster.json"), { cache: "no-store" });
    if (!answer.ok) throw new Error(String(answer.status));
    roster = await answer.json();
  } catch (error) {
    status.textContent = "could not read roster.json (" + error.message + ")";
    return;
  }
  document.getElementById("title").firstChild.textContent = roster.title + " ";
  document.title = roster.title + " preview";
  layout();
}
start();
frame();
</script>
</body>
</html>
